# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Training Library cases and Front Desk Drill calls are consistent
        run: node .github/scripts/check-data.mjs
      - name: Gemini key pool, /api/call-ai and practice call results (Google answered by the test)
        run: node .github/scripts/call-ai.mjs
      - name: Build the Pages Functions without deploying
        run: npx --yes wrangler@3 pages functions build --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Smoke test in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1 jspdf-autotable@5.0.8
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Open every library case and play the whole drill
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/smoke.cjs
      - name: Firm Calendar (the real calendar API on SQLite, in a browser)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/calendar.cjs
      - name: Time & Billing (the real time API on SQLite, in a browser)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/time.cjs
      - name: Sign-in (Admin Portal password, registration)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/login.cjs
      - name: Case editor sections (keyed saves, new tabs, reorder, drop, task accept)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/sections.cjs
      - name: Name sign-in from our platforms (registered accounts, register prompt)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/guest.cjs
      - name: Training Library edits (trainers edit library cases for everyone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/library-edit.cjs
      - name: Training Library by program (trainees edit their program's parts; one case per trainee per file, never a draft)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/library-rbac.cjs
      - name: Training Library PDF downloads (trainer copy, case files only, one case)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/library-pdf.cjs
      - name: New Intake (graded; the five intake sheets create the case)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/new-matter.cjs
      - name: Master Control Case Logs (Admins delete trainees' cases)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/case-logs.cjs
      - name: Latest updates (cases by their latest Case Note; search the Case Notes)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/latest-updates.cjs
      - name: Front Desk Drill live voice calls (token endpoint, call in a browser)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/livecall.cjs
      - name: Reception Simulator (answering a practice call by microphone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/reception-mic.cjs
      - name: Reception wrap-up and debrief (sounds-like search, authentication from the call, the 14-item scorecard)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/reception-wrapup.cjs
      - name: Case header (Client's Name, the SSN beside Contact, the Client's ID card)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/client-id.cjs
      - name: Live view (an Admin watches a trainee's screen live, mirrored as it is)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/live-view.cjs
      - name: New versions load by themselves (cms-update.js)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/cms-update.cjs
      - name: Autosave (only when something interrupts the work)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/autosave.cjs
