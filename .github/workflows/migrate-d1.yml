name: Migrate D1 to fresh database (fixes unreclaimed bloat)

on:
  workflow_dispatch:
    inputs:
      new_db_name:
        description: 'Name for the brand-new database'
        required: true
        default: 'lshcasemanagementtraining-trainingcrmlogins-v3'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export current database (schema + data)
        run: npx wrangler d1 export lshcasemanagementtraining-trainingcrmlogins --remote --output=backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

      - name: Delete the target database if it exists (guarantees a clean slate for every run)
        run: |
          set +e
          npx wrangler d1 delete "${{ github.event.inputs.new_db_name }}" --skip-confirmation 2>&1
          echo "(a 'not found' message above is fine — it just means there was nothing to delete)"
          set -e
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

      - name: Create a brand-new, empty database
        id: create_db
        run: |
          set +e
          OUTPUT=$(npx wrangler d1 create "${{ github.event.inputs.new_db_name }}" 2>&1)
          CREATE_EXIT=$?
          set -e
          echo "$OUTPUT"
          echo "wrangler create exit code: $CREATE_EXIT"
          NEW_ID=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$NEW_ID" ]; then
            echo "Could not find a new database ID in wrangler's output above — aborting."
            exit 1
          fi
          echo "New database ID: $NEW_ID"
          echo "new_id=$NEW_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

      - name: Load export into local SQLite, then generate size-safe import batches from real parsed rows
        run: |
          cat > split_import.py << 'PYEOF_INNER'
          import sqlite3, subprocess, sys, os

          THRESHOLD = 40000
          BATCH_LIMIT = 500000
          CHUNK_SIZE = 20000
          ROWS_PER_INSERT = 50

          def sql_literal(value):
              if value is None:
                  return "NULL"
              if isinstance(value, (int, float)):
                  return str(value)
              if isinstance(value, bytes):
                  return "X'" + value.hex() + "'"
              return "'" + str(value).replace("'", "''") + "'"

          def build_statements(local_db_path):
              conn = sqlite3.connect(local_db_path)
              conn.row_factory = sqlite3.Row
              cur = conn.cursor()

              statements = []
              cur.execute("SELECT type, name, sql FROM sqlite_master WHERE sql IS NOT NULL AND name NOT LIKE 'sqlite_%' ORDER BY (type='table') DESC")
              schema_rows = cur.fetchall()

              table_names = []
              for row in schema_rows:
                  statements.append(row['sql'].rstrip(';') + ';')
                  if row['type'] == 'table':
                      table_names.append(row['name'])

              for table in table_names:
                  cur2 = conn.cursor()
                  cur2.execute(f'SELECT * FROM "{table}"')
                  cols = [d[0] for d in cur2.description]
                  col_list = ', '.join(f'"{c}"' for c in cols)

                  pending_rows = []
                  pending_size = [0]

                  def flush():
                      if pending_rows:
                          values_sql = ',\n'.join(pending_rows)
                          statements.append(f'INSERT INTO "{table}" ({col_list}) VALUES {values_sql};')
                          pending_rows.clear()
                          pending_size[0] = 0

                  for row in cur2:
                      values = [sql_literal(row[c]) for c in cols]
                      tuple_sql = '(' + ', '.join(values) + ')'

                      if len(tuple_sql) > THRESHOLD:
                          flush()
                          id_col = None
                          for c in cols:
                              if c.lower() == 'id':
                                  id_col = c
                                  break
                          max_i = max(range(len(cols)), key=lambda i: len(values[i]))
                          if id_col is None or cols[max_i].lower() == 'id' or len(values[max_i]) <= THRESHOLD:
                              statements.append(f'INSERT INTO "{table}" ({col_list}) VALUES {tuple_sql};')
                              continue
                          big_col = cols[max_i]
                          big_value = row[big_col]
                          id_value = row[id_col]
                          empty_values = list(values)
                          empty_values[max_i] = "X''" if isinstance(big_value, bytes) else "''"
                          statements.append(f'INSERT INTO "{table}" ({col_list}) VALUES (' + ', '.join(empty_values) + ');')
                          if isinstance(big_value, bytes):
                              for i in range(0, len(big_value), CHUNK_SIZE):
                                  chunk = big_value[i:i+CHUNK_SIZE]
                                  statements.append(
                                      f'UPDATE "{table}" SET "{big_col}" = "{big_col}" || X\'{chunk.hex()}\' WHERE "{id_col}" = {sql_literal(id_value)};'
                                  )
                          else:
                              for i in range(0, len(big_value), CHUNK_SIZE):
                                  chunk = big_value[i:i+CHUNK_SIZE]
                                  statements.append(
                                      f'UPDATE "{table}" SET "{big_col}" = "{big_col}" || {sql_literal(chunk)} WHERE "{id_col}" = {sql_literal(id_value)};'
                                  )
                          continue

                      pending_rows.append(tuple_sql)
                      pending_size[0] += len(tuple_sql)
                      if len(pending_rows) >= ROWS_PER_INSERT or pending_size[0] > THRESHOLD:
                          flush()
                  flush()

              conn.close()
              return statements

          def batch_statements(statements):
              batches = []
              current_batch = []
              current_size = 0
              for stmt in statements:
                  stmt_len = len(stmt)
                  if current_size + stmt_len > BATCH_LIMIT and current_batch:
                      batches.append(current_batch)
                      current_batch = []
                      current_size = 0
                  current_batch.append(stmt)
                  current_size += stmt_len
              if current_batch:
                  batches.append(current_batch)
              return batches

          if __name__ == '__main__':
              db_name = sys.argv[1]

              # Load the raw export into a real local SQLite file — this is what
              # guarantees correct parsing of the source dump, no matter what
              # characters/edge cases are in the actual data.
              local_path = 'local_import.db'
              if os.path.exists(local_path):
                  os.remove(local_path)
              local_conn = sqlite3.connect(local_path)
              with open('backup.sql', 'r', encoding='utf-8') as f:
                  local_conn.executescript(f.read())
              local_conn.commit()
              local_conn.close()
              print("Loaded export into local SQLite file successfully.")

              statements = build_statements(local_path)
              over = [s for s in statements if len(s) > THRESHOLD]
              print(f"Total statements to import: {len(statements)}")
              print(f"Statements still over threshold: {len(over)}")

              batches = batch_statements(statements)
              print(f"Batched into {len(batches)} files for import")

              for idx, batch in enumerate(batches):
                  fname = f"batch_{idx:04d}.sql"
                  with open(fname, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(batch))
                  batch_bytes = sum(len(s) for s in batch)
                  print(f"Executing batch {idx+1}/{len(batches)} ({len(batch)} statements, {batch_bytes} bytes)...")
                  result = subprocess.run(
                      ['npx', 'wrangler', 'd1', 'execute', db_name, '--remote', f'--file={fname}']
                  )
                  if result.returncode != 0:
                      print(f"FAILED on batch {idx}")
                      sys.exit(1)
                  os.remove(fname)
              print("All batches imported successfully.")

          PYEOF_INNER
          python3 split_import.py "${{ github.event.inputs.new_db_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0
      - name: Point wrangler.toml at the new database
        run: |
          sed -i "s/database_name = \".*\"/database_name = \"${{ github.event.inputs.new_db_name }}\"/" wrangler.toml
          sed -i "s/database_id = \".*\"/database_id = \"${{ steps.create_db.outputs.new_id }}\"/" wrangler.toml
          echo "--- updated wrangler.toml ---"
          cat wrangler.toml

      - name: Commit and push the updated wrangler.toml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "Migrate to fresh D1 database (old one had unreclaimable bloat, VACUUM unsupported on D1)"
          git push

      - name: Upload the exported backup as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-sql
          path: backup.sql
