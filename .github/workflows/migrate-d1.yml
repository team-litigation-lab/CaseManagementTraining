name: Migrate D1 to fresh database (fixes unreclaimed bloat)

on:
  workflow_dispatch:
    inputs:
      new_db_name:
        description: 'Name for the brand-new database'
        required: true
        default: 'lshcasemanagementtraining-trainingcrmlogins-v3'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export current database (schema + data)
        run: npx wrangler d1 export lshcasemanagementtraining-trainingcrmlogins --remote --output=backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

      - name: Create a brand-new, empty database
        id: create_db
        run: |
          OUTPUT=$(npx wrangler d1 create "${{ github.event.inputs.new_db_name }}" 2>&1)
          echo "$OUTPUT"
          NEW_ID=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$NEW_ID" ]; then
            echo "Could not find a new database ID in wrangler's output — aborting."
            exit 1
          fi
          echo "New database ID: $NEW_ID"
          echo "new_id=$NEW_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

      - name: Split oversized statements (row-level and field-level) and import in safe batches
        run: |
          cat > split_import.py << 'PYEOF'
          import re, subprocess, sys, os

          def split_statements(sql):
              statements = []
              current = []
              in_string = False
              i = 0
              n = len(sql)
              while i < n:
                  c = sql[i]
                  current.append(c)
                  if c == "'":
                      if in_string and i + 1 < n and sql[i+1] == "'":
                          current.append(sql[i+1]); i += 2; continue
                      in_string = not in_string
                  elif c == ';' and not in_string:
                      stmt = ''.join(current).strip()
                      if stmt:
                          statements.append(stmt)
                      current = []
                  i += 1
              tail = ''.join(current).strip()
              if tail:
                  statements.append(tail)
              return statements

          def split_top_level(s, sep=','):
              parts = []
              current = []
              depth = 0
              in_string = False
              i = 0
              n = len(s)
              while i < n:
                  c = s[i]
                  if c == "'":
                      current.append(c)
                      if in_string and i + 1 < n and s[i+1] == "'":
                          current.append(s[i+1]); i += 2; continue
                      in_string = not in_string
                      i += 1
                      continue
                  if not in_string:
                      if c == '(':
                          depth += 1
                      elif c == ')':
                          depth -= 1
                      if c == sep and depth == 0:
                          part = ''.join(current).strip()
                          if part:
                              parts.append(part)
                          current = []
                          i += 1
                          continue
                  current.append(c)
                  i += 1
              tail = ''.join(current).strip()
              if tail:
                  parts.append(tail)
              return parts

          def unquote(val):
              val = val.strip()
              if val.startswith("'") and val.endswith("'"):
                  return val[1:-1].replace("''", "'")
              return val

          def sql_quote(val):
              return "'" + val.replace("'", "''") + "'"

          THRESHOLD = 40000
          BATCH_LIMIT = 500000
          CHUNK_SIZE = 20000

          insert_re = re.compile(r'^INSERT INTO ([^\s\(]+)\s*\(([^\)]*)\)\s*VALUES\s*(.*)$', re.IGNORECASE | re.DOTALL)

          def handle_oversized_row(table, columns, tuple_str):
              inner = tuple_str.strip()
              if inner.startswith('(') and inner.endswith(')'):
                  inner = inner[1:-1]
              fields = split_top_level(inner, ',')
              if len(fields) != len(columns):
                  return [f"INSERT INTO {table} ({', '.join(columns)}) VALUES {tuple_str};"]

              id_idx = None
              for idx, col in enumerate(columns):
                  if col.strip().strip('"').lower() == 'id':
                      id_idx = idx
                      break

              max_idx = max(range(len(fields)), key=lambda i: len(fields[i]))

              if id_idx is None or max_idx == id_idx or len(fields[max_idx]) <= THRESHOLD:
                  return [f"INSERT INTO {table} ({', '.join(columns)}) VALUES {tuple_str};"]

              id_value = fields[id_idx].strip()
              big_value = unquote(fields[max_idx])
              target_col = columns[max_idx].strip().strip('"')

              insert_fields = list(fields)
              insert_fields[max_idx] = "''"
              stmts = [f"INSERT INTO {table} ({', '.join(columns)}) VALUES ({', '.join(insert_fields)});"]

              for i in range(0, len(big_value), CHUNK_SIZE):
                  chunk = big_value[i:i+CHUNK_SIZE]
                  stmts.append(
                      f"UPDATE {table} SET {target_col} = {target_col} || {sql_quote(chunk)} WHERE id = {id_value};"
                  )
              return stmts

          def build_batches(path):
              with open(path, 'r', encoding='utf-8') as f:
                  sql = f.read()
              statements = split_statements(sql)
              expanded = []

              for stmt in statements:
                  stripped = stmt.strip()
                  if len(stmt) > THRESHOLD and stripped.upper().startswith('INSERT'):
                      m = insert_re.match(stripped)
                      if m:
                          table = m.group(1)
                          columns = split_top_level(m.group(2), ',')
                          values_part = m.group(3).rstrip().rstrip(';').strip()
                          tuples = split_top_level(values_part, ',')
                          for t in tuples:
                              if len(t) > THRESHOLD:
                                  expanded.extend(handle_oversized_row(table, columns, t))
                              else:
                                  expanded.append(f"INSERT INTO {table} ({', '.join(columns)}) VALUES {t};")
                          continue
                  expanded.append(stmt if stmt.endswith(';') else stmt + ';')

              batches = []
              current_batch = []
              current_size = 0
              for stmt in expanded:
                  stmt_len = len(stmt)
                  if current_size + stmt_len > BATCH_LIMIT and current_batch:
                      batches.append(current_batch)
                      current_batch = []
                      current_size = 0
                  current_batch.append(stmt)
                  current_size += stmt_len
              if current_batch:
                  batches.append(current_batch)
              return expanded, batches

          if __name__ == '__main__':
              db_name = sys.argv[1]
              expanded, batches = build_batches('backup.sql')
              print(f"Total statements after splitting: {len(expanded)}")
              over = [s for s in expanded if len(s) > THRESHOLD]
              print(f"Statements still over threshold: {len(over)}")
              print(f"Batched into {len(batches)} files for import")
              for idx, batch in enumerate(batches):
                  fname = f"batch_{idx:04d}.sql"
                  with open(fname, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(batch))
                  batch_bytes = sum(len(s) for s in batch)
                  print(f"Executing batch {idx+1}/{len(batches)} ({len(batch)} statements, {batch_bytes} bytes)...")
                  result = subprocess.run(
                      ['npx', 'wrangler', 'd1', 'execute', db_name, '--remote', f'--file={fname}']
                  )
                  if result.returncode != 0:
                      print(f"FAILED on batch {idx}")
                      sys.exit(1)
                  os.remove(fname)
              print("All batches imported successfully.")
          PYEOF
          python3 split_import.py "${{ github.event.inputs.new_db_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

      - name: Point wrangler.toml at the new database
        run: |
          sed -i "s/database_name = \".*\"/database_name = \"${{ github.event.inputs.new_db_name }}\"/" wrangler.toml
          sed -i "s/database_id = \".*\"/database_id = \"${{ steps.create_db.outputs.new_id }}\"/" wrangler.toml
          echo "--- updated wrangler.toml ---"
          cat wrangler.toml

      - name: Commit and push the updated wrangler.toml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "Migrate to fresh D1 database (old one had unreclaimable bloat, VACUUM unsupported on D1)"
          git push

      - name: Upload the exported backup as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-sql
          path: backup.sql
