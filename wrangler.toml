name = "case-management-training"
compatibility_date = "2024-03-20"
pages_build_output_dir = "./" 

[[d1_databases]]
binding = "DB" 
database_name = "lshcasemanagementtraining-trainingcrmlogins-v3"
database_id = "10414834-819b-47c4-8918-77f66a24b9e9"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "lshtraining"

# The courses' KV namespace, shared by every LSH site. Read-only here: the server
# request meter (functions/api/request-budget.js) reads "_request-usage", which
# EA-PA-TRAINING's Request budget workflow saves there.
[[kv_namespaces]]
binding = "COURSE_KV"
id = "b121aa911590471bbad351d03274d7f4"

# Gemini calls refused for the trainee's region (the Front Desk practice calls' caller and debrief,
# functions/_ai.js) are sent again from GeminiRelay, the EA-PA Worker's Durable Object pinned to the US.
[[durable_objects.bindings]]
name = "GEMINI_RELAY"
class_name = "GeminiRelay"
script_name = "ea-pa-training"
